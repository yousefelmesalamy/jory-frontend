<form class="review-form" [formGroup]="form" (ngSubmit)="submit()">
  <h3 class="review-form__title">{{ t().writeReview }}</h3>

  <div class="review-form__field">
    <span class="review-form__label">{{ t().reviewRatingLabel }}</span>
    <div class="review-form__stars" role="radiogroup" [attr.aria-label]="t().reviewRatingLabel">
      @for (star of stars; track star) {
        <button
          type="button"
          class="review-form__star"
          [class.review-form__star--on]="star <= form.controls.rating.value"
          role="radio"
          [attr.aria-checked]="star === form.controls.rating.value"
          [attr.aria-label]="star"
          (click)="setRating(star)"
        >
          ★
        </button>
      }
    </div>
  </div>

  <div class="review-form__field">
    <label class="review-form__label" for="review-title">{{ t().reviewTitleLabel }}</label>
    <input
      id="review-title"
      class="review-form__input"
      type="text"
      formControlName="title"
      [placeholder]="t().reviewTitlePlaceholder"
    />
  </div>

  <div class="review-form__field">
    <label class="review-form__label" for="review-body">{{ t().reviewBodyLabel }}</label>
    <textarea
      id="review-body"
      class="review-form__input review-form__textarea"
      rows="4"
      formControlName="body"
      [placeholder]="t().reviewBodyPlaceholder"
    ></textarea>
  </div>

  @if (errorMessage()) {
    <p class="review-form__message review-form__message--error">{{ errorMessage() }}</p>
  }
  @if (posted_()) {
    <p class="review-form__message review-form__message--success">{{ t().reviewPosted }}</p>
  }

  <button class="review-form__submit" type="submit" [disabled]="form.invalid || submitting()">
    {{ t().submitReview }}
  </button>
</form>
