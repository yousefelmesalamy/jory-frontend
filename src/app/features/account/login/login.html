<section class="login">
  <h1 class="login__title">{{ t().authLoginTitle }}</h1>

  <app-login-form (success)="onSuccess()" />

  <p class="login__switch">
    {{ t().authNoAccount }}
    <a class="login__switch-link" routerLink="/account/register">{{ t().authSwitchToRegister }}</a>
  </p>
</section>
