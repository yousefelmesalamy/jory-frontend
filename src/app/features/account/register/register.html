<section class="register">
  <h1 class="register__title">{{ t().authRegisterTitle }}</h1>

  <app-register-form (success)="onSuccess()" />

  <p class="register__switch">
    {{ t().authHaveAccount }}
    <a class="register__switch-link" routerLink="/account/login">{{ t().authSwitchToLogin }}</a>
  </p>
</section>
