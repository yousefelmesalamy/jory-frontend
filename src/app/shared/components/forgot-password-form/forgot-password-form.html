@if (sent()) {
  <div class="forgot-form__done">
    <h2 class="forgot-form__done-title">{{ t().authForgotSentTitle }}</h2>
    <p class="forgot-form__done-body">{{ t().authForgotSentBody }}</p>
  </div>
} @else {
  <form class="forgot-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <p class="forgot-form__lead">{{ t().authForgotSubtitle }}</p>

    <div class="field">
      <label class="field__label" for="forgot-email">{{ t().authEmail }}</label>
      <div
        class="field__control"
        [class.field__control--invalid]="form.controls.email.invalid && form.controls.email.touched"
      >
        <input
          id="forgot-email"
          class="field__input"
          type="email"
          autocomplete="email"
          [placeholder]="t().authEmailPlaceholder"
          formControlName="email"
        />
      </div>
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <p class="field__error">{{ t().authFieldEmail }}</p>
      }
    </div>

    @if (errorMessage()) {
      <p class="form__error" role="alert">{{ errorMessage() }}</p>
    }

    <button class="forgot-form__submit" type="submit" [disabled]="submitting()">
      {{ submitting() ? t().authWorking : t().authForgotSubmit }}
    </button>
  </form>
}

<button class="forgot-form__back" type="button" (click)="backToLogin.emit()">
  {{ t().authBackToLogin }}
</button>
