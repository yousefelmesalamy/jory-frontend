<form class="login-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="field">
    <label class="field__label" for="login-email">{{ t().authEmailOrUsername }}</label>
    <div
      class="field__control"
      [class.field__control--invalid]="form.controls.email.invalid && form.controls.email.touched"
    >
      <input
        id="login-email"
        class="field__input"
        type="text"
        autocomplete="username"
        [placeholder]="t().authEmailOrUsernamePlaceholder"
        formControlName="email"
      />
    </div>
    @if (form.controls.email.invalid && form.controls.email.touched) {
      <p class="field__error">{{ t().authFieldRequired }}</p>
    }
  </div>

  <div class="field">
    <label class="field__label" for="login-password">{{ t().authPassword }}</label>
    <div
      class="field__control"
      [class.field__control--invalid]="
        form.controls.password.invalid && form.controls.password.touched
      "
    >
      <input
        id="login-password"
        class="field__input field__input--trailing"
        [type]="passwordVisible() ? 'text' : 'password'"
        autocomplete="current-password"
        [placeholder]="t().authPassword"
        formControlName="password"
      />
      <button
        class="field__reveal"
        type="button"
        [attr.aria-label]="passwordVisible() ? t().authHidePassword : t().authShowPassword"
        [attr.aria-pressed]="passwordVisible()"
        (click)="togglePassword()"
      >
        @if (passwordVisible()) {
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
            <path
              d="M3 3l14 14M8.3 8.4a2.4 2.4 0 003.4 3.4M6.1 6.2C4.3 7.3 2.9 8.8 2 10c1.7 2.6 4.5 5 8 5 1.4 0 2.7-.4 3.8-1M10 5c3.5 0 6.3 2.4 8 5-.6.9-1.4 1.8-2.4 2.6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            />
          </svg>
        } @else {
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
            <path
              d="M2 10c1.7-2.6 4.5-5 8-5s6.3 2.4 8 5c-1.7 2.6-4.5 5-8 5s-6.3-2.4-8-5z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
            />
            <circle cx="10" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.4" />
          </svg>
        }
      </button>
    </div>
    @if (form.controls.password.invalid && form.controls.password.touched) {
      <p class="field__error">{{ t().authFieldRequired }}</p>
    }
  </div>

  @if (errorMessage()) {
    <p class="form__error" role="alert">{{ errorMessage() }}</p>
  }

  <button class="form__submit" type="submit" [disabled]="submitting()">
    {{ submitting() ? t().authWorking : t().authLoginSubmit }}
  </button>
</form>
