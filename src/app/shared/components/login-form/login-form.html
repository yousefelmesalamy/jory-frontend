<form class="login-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="login-form__field">
    <label class="login-form__label" for="login-email">{{ t().authEmailOrUsername }}</label>
    <input
      id="login-email"
      class="login-form__input"
      type="text"
      autocomplete="username"
      formControlName="email"
    />
    @if (form.controls.email.invalid && form.controls.email.touched) {
      <p class="login-form__field-error">{{ t().authFieldRequired }}</p>
    }
  </div>

  <div class="login-form__field">
    <label class="login-form__label" for="login-password">{{ t().authPassword }}</label>
    <input
      id="login-password"
      class="login-form__input"
      type="password"
      autocomplete="current-password"
      formControlName="password"
    />
    @if (form.controls.password.invalid && form.controls.password.touched) {
      <p class="login-form__field-error">{{ t().authFieldRequired }}</p>
    }
  </div>

  @if (errorMessage()) {
    <p class="login-form__message login-form__message--error">{{ errorMessage() }}</p>
  }

  <button class="login-form__submit" type="submit" [disabled]="submitting()">
    {{ t().authLoginSubmit }}
  </button>
</form>
